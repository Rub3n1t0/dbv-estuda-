name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar APK de teste
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DBV-Estuda-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar link direto do APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DBV-Estuda.apk
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao DBV-Estuda.apk \
            --title "DBV Estuda+ (última versão)" \
            --notes "APK de teste gerado automaticamente. Baixe DBV-Estuda.apk no celular Android e instale." \
            --latest
